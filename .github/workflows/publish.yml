name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
